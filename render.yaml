services:
  - type: web
    name: daytrader
    runtime: docker
    plan: free
    branch: claude/blissful-ptolemy-heqax9
    healthCheckPath: /health
    envVars:
      - key: API_TOKEN
        generateValue: true
      - key: SEC_USER_AGENT
        value: "Day Trader teste contato@example.com"
      - key: ALPHAVANTAGE_API_KEY   # opcional: cole a chave no painel do Render
        sync: false
      - key: STARTING_CASH
        value: "5000"
